name: build
on:
  push:
    branches: [main]
    paths: [project.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Unpack
        run: |
          rm -rf src
          mkdir src
          unzip -q project.zip -d src
      - name: Build
        working-directory: src
        run: gradle assembleDebug --no-daemon
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src/launcher/build/outputs/apk/debug/launcher-debug.apk Lunna-Launcher.apk
          cp src/admin/build/outputs/apk/debug/admin-debug.apk Lunna-Admin.apk
          gh release delete apps --cleanup-tag -y || true
          gh release create apps Lunna-Launcher.apk Lunna-Admin.apk --title "Lunna apps" --notes "build"
